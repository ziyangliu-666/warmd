[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warmd"
version = "0.1.0"
description = "Pre-warmed fork-server pool for short GPU tasks on top of warmd"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["warmd"]
